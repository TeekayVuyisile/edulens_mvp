# Render blueprint, all on free plans:
#  - edulens-lms-app (static site): the app people visit. Served from Render's CDN and never
#    sleeps, so it loads at once; it wakes the API in the background and explains the wait.
#  - edulens-lms (web service): the API. Free instances sleep after 15 minutes and take up to a
#    minute to wake. It still serves the built app on its own URL too.
# The database is Neon (Postgres 17); paste its connection string as DATABASE_URL.
# Settings marked `sync: false` are entered in the Render dashboard when the
# blueprint is created (they are secrets, so they're never stored in this file).

services:
  - type: web
    name: edulens-lms
    runtime: node
    plan: free
    region: frankfurt # closest Render region to South Africa; create the Neon project in AWS Frankfurt too
    branch: master
    buildCommand: npm ci --prefix backend && npm ci --prefix frontend --include=dev && npm run build --prefix frontend
    # Applies new migrations, optionally creates the demo school, then starts the API.
    startCommand: npm run start:render --prefix backend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL # Neon connection string, ending in ?sslmode=require
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: FRONTEND_URL # the static site's URL (CORS origin + email links): https://edulens-lms-app.onrender.com
        sync: false
      - key: SUPER_ADMIN_EMAIL # the first super admin, created on first start
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO # "true" creates Sunflower Primary (Demo) once, for portfolio visitors
        value: "true"
      - key: DEMO_LOGIN # "true" shows one-click demo sign-in buttons on the login page
        value: "true"
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY # optional: AI worksheets stay "not set up" without it
        sync: false

  - type: web
    name: edulens-lms-app
    runtime: static
    branch: master
    buildCommand: npm ci --prefix frontend --include=dev && npm run build --prefix frontend
    staticPublishPath: ./frontend/dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # The API's public URL, baked into the build (fromService only gives a private hostname).
      - key: VITE_API_URL
        value: https://edulens-lms.onrender.com
    routes:
      # Client-side routes (/dashboard, /teacher/…) all load index.html.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
